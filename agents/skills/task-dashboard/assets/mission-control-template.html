<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a0f;
      --panel: #101925;
      --ink: #e7eef9;
      --muted: #91a1b8;
      --faint: #516176;
      --line: rgba(143, 166, 199, .22);
      --cyan: #35d5ff;
      --green: #42e099;
      --amber: #ffbf47;
      --red: #ff5b6e;
      --purple: #a78bfa;
      --shadow: 0 20px 60px rgba(0, 0, 0, .35);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(53, 213, 255, .055) 1px, transparent 1px),
        linear-gradient(0deg, rgba(53, 213, 255, .045) 1px, transparent 1px),
        radial-gradient(circle at 18% 12%, rgba(53, 213, 255, .14), transparent 28%),
        radial-gradient(circle at 84% 10%, rgba(255, 91, 110, .11), transparent 24%),
        linear-gradient(135deg, #06080d 0%, #0a1019 54%, #05070b 100%);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
      line-height: 1.48;
    }

    main {
      width: min(1380px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 46px;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      max-width: 900px;
      font-size: clamp(34px, 4.7vw, 64px);
      line-height: .98;
      letter-spacing: 0;
    }

    h2 {
      font-size: 17px;
      letter-spacing: 0;
      text-transform: uppercase;
      color: #f4f8ff;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 15px;
      letter-spacing: 0;
      margin-bottom: 4px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .95em;
      color: #cdf4ff;
      background: rgba(53, 213, 255, .09);
      border: 1px solid rgba(53, 213, 255, .18);
      border-radius: 5px;
      padding: 1px 5px;
    }

    .mission-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 16px;
    }

    .hero, .progress-tower, .panel, .truth {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      background:
        linear-gradient(135deg, rgba(53, 213, 255, .13), transparent 42%),
        linear-gradient(180deg, rgba(16, 25, 37, .92), rgba(8, 13, 20, .92));
      padding: 24px;
      min-height: 244px;
      display: grid;
      align-content: space-between;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 38px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(53, 213, 255, .65), transparent);
    }

    .eyebrow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .chip, .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .055);
      color: var(--muted);
      font-weight: 850;
      white-space: nowrap;
    }

    .chip {
      min-height: 28px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .tag {
      width: fit-content;
      height: 25px;
      padding: 0 9px;
      font-size: 11px;
      text-transform: uppercase;
    }

    .good { color: #bdf7d9; border-color: rgba(66,224,153,.4); background: rgba(66,224,153,.08); }
    .warn { color: #ffe0a3; border-color: rgba(255,191,71,.4); background: rgba(255,191,71,.08); }
    .bad { color: #ffc3ca; border-color: rgba(255,91,110,.42); background: rgba(255,91,110,.09); }
    .info { color: #c7edff; border-color: rgba(53,213,255,.4); background: rgba(53,213,255,.08); }
    .note { color: #ddd4ff; border-color: rgba(167,139,250,.4); background: rgba(167,139,250,.08); }

    .hero-subtitle {
      max-width: 920px;
      color: var(--muted);
      font-size: 17px;
      margin-top: 14px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #b8c7dc;
    }

    .progress-tower {
      background: linear-gradient(180deg, rgba(16, 25, 37, .96), rgba(8, 13, 20, .96));
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .ring {
      width: 178px;
      height: 178px;
      margin: 0 auto;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #0c131d 0 55%, transparent 56%),
        conic-gradient(var(--green) 0 calc(var(--progress) * 1%), var(--amber) calc(var(--progress) * 1%) 82%, rgba(255,255,255,.11) 82% 100%);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 38px rgba(53,213,255,.10);
    }

    .ring strong {
      display: block;
      font-size: 44px;
      line-height: 1;
    }

    .ring span {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .tower-lines {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .tower-lines b { color: var(--ink); }

    .truth-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .truth {
      background: rgba(16, 25, 37, .78);
      padding: 14px;
      min-height: 118px;
      display: grid;
      align-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .truth::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: var(--cyan);
    }

    .truth.good::before { background: var(--green); }
    .truth.warn::before { background: var(--amber); }
    .truth.bad::before { background: var(--red); }

    .truth small {
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .truth strong {
      display: block;
      font-size: 24px;
      line-height: 1.08;
      margin: 6px 0;
    }

    .truth p, .desc {
      color: var(--muted);
      font-size: 14px;
    }

    .truth p { font-size: 13px; }
    .desc strong { color: var(--ink); }

    .grid-main {
      display: grid;
      grid-template-columns: 1.05fr 1.25fr .9fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 16px;
    }

    .panel {
      background: rgba(16, 25, 37, .83);
      padding: 16px;
      overflow: hidden;
    }

    .panel.dim { background: rgba(11, 17, 26, .88); }

    .stack, .todo {
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid rgba(143, 166, 199, .16);
    }

    .row:first-child { border-top: 0; padding-top: 0; }

    .signal-map {
      min-height: 420px;
      background:
        linear-gradient(90deg, rgba(53,213,255,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(53,213,255,.05) 1px, transparent 1px),
        rgba(7, 10, 15, .46);
      background-size: 36px 36px;
      border: 1px solid rgba(53,213,255,.18);
      border-radius: var(--radius);
      padding: 12px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .node rect {
      fill: rgba(16, 25, 37, .96);
      stroke: rgba(53, 213, 255, .42);
      stroke-width: 1.3;
      rx: 8;
    }

    .node.fail rect { stroke: rgba(255, 91, 110, .62); }
    .node.pass rect { stroke: rgba(66, 224, 153, .62); }
    .node.warn rect { stroke: rgba(255, 191, 71, .62); }

    .node text {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .node .sub {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .wire {
      fill: none;
      stroke: rgba(53, 213, 255, .72);
      stroke-width: 2;
      marker-end: url(#arrow);
    }

    .wire.good { stroke: rgba(66, 224, 153, .72); }
    .wire.bad { stroke: rgba(255, 91, 110, .75); }
    .wire.warn { stroke: rgba(255, 191, 71, .76); }

    .attempts {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .attempt {
      border: 1px solid rgba(143, 166, 199, .18);
      border-radius: var(--radius);
      background: rgba(7, 10, 15, .42);
      padding: 12px;
      min-height: 146px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .attempt .num {
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--faint);
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .todo-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid rgba(143, 166, 199, .16);
      border-radius: var(--radius);
      background: rgba(7, 10, 15, .34);
    }

    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .check.done { color: #06110c; background: var(--green); border-color: var(--green); }
    .check.now { color: #130c02; background: var(--amber); border-color: var(--amber); }
    .check.block { color: #1c0508; background: var(--red); border-color: var(--red); }

    .priority {
      font-size: 11px;
      font-weight: 850;
      color: var(--muted);
      white-space: nowrap;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(var(--heatmap-cols), minmax(0, 1fr));
      border: 1px solid rgba(143, 166, 199, .2);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .heatmap div {
      padding: 10px;
      border-right: 1px solid rgba(143, 166, 199, .16);
      border-bottom: 1px solid rgba(143, 166, 199, .16);
      min-height: 44px;
      font-size: 13px;
      color: var(--muted);
    }

    .heatmap div:nth-child(var(--heatmap-cols)n) { border-right: 0; }
    .heatmap .head {
      background: rgba(255,255,255,.055);
      color: var(--ink);
      font-weight: 850;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .06em;
    }

    .heatmap .pass { color: #c8f8dd; background: rgba(66,224,153,.08); }
    .heatmap .fail { color: #ffd0d6; background: rgba(255,91,110,.10); }
    .heatmap .pending { color: #ffe5ac; background: rgba(255,191,71,.08); }

    .footer {
      color: var(--faint);
      font-size: 12px;
      text-align: right;
      margin-top: 10px;
    }

    @media (max-width: 1120px) {
      .mission-header, .grid-main, .split, .truth-strip, .attempts { grid-template-columns: 1fr; }
      .progress-tower { grid-template-columns: 180px 1fr; align-items: center; }
    }

    @media (max-width: 720px) {
      main { width: min(100% - 22px, 680px); padding-top: 18px; }
      .hero { padding: 18px; }
      .progress-tower, .row, .todo-item { grid-template-columns: 1fr; }
      .heatmap { grid-template-columns: 1fr; }
      .heatmap div { border-right: 0; }
    }
  </style>
</head>
<body>
  {{BODY}}
</body>
</html>
